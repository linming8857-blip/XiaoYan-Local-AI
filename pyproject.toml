[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xiaoyan-local-ai"
version = "0.1.0"
description = "Local-first AI assistant with memory, reading, tools and permission-scoped computer control."
requires-python = ">=3.11"
authors = [
  { name = "XiaoYan Local AI contributors" }
]
dependencies = []

[project.scripts]
xiaoyan-local = "xiaoyan_local.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
